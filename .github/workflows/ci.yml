name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The ERP-port pytest suite is maintained outside this repository for
    # local-only validation. CI intentionally does not run that suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alertafiscal
          POSTGRES_PASSWORD: alertafiscal
          POSTGRES_DB: alertafiscal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alertafiscal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret
      FLASK_APP: wsgi:app
      DATABASE_URL: postgresql+psycopg://alertafiscal:alertafiscal@localhost:5432/alertafiscal_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis
        run: python -m compileall -q app migrations wsgi.py

      - name: Migraciones contra PostgreSQL de CI
        run: flask db upgrade

      - name: Semilla idempotente
        run: |
          flask seed-demo --yes
          flask seed-demo --yes

      - name: Health check contra PostgreSQL
        run: |
          python - <<'PY'
          from app import create_app
          from app.extensions import db
          from sqlalchemy import text

          app = create_app()
          with app.app_context():
              assert db.session.execute(text("SELECT count(*) FROM companies")).scalar() == 2
          print("PostgreSQL OK")
          PY

  frontend:
    name: Frontend (TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y compilar
        run: npm run build
