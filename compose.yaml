name: alertafiscal

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      # Solo accesible desde el host local, no desde la red.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - alertafiscal_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  alertafiscal_pgdata:
    name: alertafiscal_pgdata
